name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have a look at the [roadmap](https://github.com/muhep06/DisplayKnob/blob/main/docs/ROADMAP.md) first: your idea may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like DisplayKnob to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
